<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="landGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />

  <!-- Map Background Ocean Grid -->
  <rect x="16" y="16" width="96" height="96" rx="14" fill="#0f2b48" stroke="#1e3a5f" stroke-width="1.5" />
  
  <!-- Subtle Grid Lines -->
  <line x1="16" y1="48" x2="112" y2="48" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="16" y1="80" x2="112" y2="80" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="48" y1="16" x2="48" y2="112" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
  <line x1="80" y1="16" x2="80" y2="112" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />

  <!-- Landmass Continent 1 (Green) -->
  <path d="M 28 36 Q 38 24 54 28 Q 72 32 76 44 Q 80 56 68 64 Q 54 72 40 68 Q 24 64 24 50 Z" 
        fill="url(#mapGrad)" stroke="#34d399" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Landmass Continent 2 (Blue / Sovereign State) -->
  <path d="M 64 64 Q 78 58 92 64 Q 102 74 98 88 Q 88 100 74 96 Q 58 92 56 78 Q 54 68 64 64 Z" 
        fill="url(#landGrad2)" stroke="#60a5fa" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Voronoi Border Division -->
  <path d="M 52 46 L 68 64 L 72 52" fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2,2" opacity="0.9" />

  <!-- Capital Markers (Points) -->
  <circle cx="48" cy="46" r="3.5" fill="#f8fafc" stroke="#059669" stroke-width="1.5" />
  <circle cx="82" cy="78" r="3.5" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5" />

  <!-- Simplified Clean Navigation Star in top right -->
  <g transform="translate(94, 30)">
    <circle cx="0" cy="0" r="10" fill="#0b1b2b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <!-- Crisp 4-Point Star -->
    <path d="M 0 -7.5 L 1.8 -1.8 L 7.5 0 L 1.8 1.8 L 0 7.5 L -1.8 1.8 L -7.5 0 L -1.8 -1.8 Z" fill="#f8fafc" />
    <!-- North Pointer Highlight -->
    <polygon points="0,-7.5 1.8,-1.8 -1.8,-1.8" fill="#38bdf8" />
    <circle cx="0" cy="0" r="1" fill="#0b1b2b" />
  </g>
</svg>
